# 前端容器：提供 React 打包後的靜態檔，並把 /api 同源反向代理到 FastAPI（瀏覽器不需要跨域）
server {
    listen 80;
    root /usr/share/nginx/html;
    # 錯誤頁與 Server 標頭不帶 nginx 版本號（安全標頭統一由 Caddy 加，見 Caddyfile）
    server_tokens off;

    # SSE（/api/v1/chat/tasks/{id}/events）：關掉緩衝才能逐字推送；讀取逾時要大於後端 15 秒的心跳間隔
    location /api/ {
        proxy_pass http://api:8741;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        client_max_body_size 12m;
    }

    # 打包檔名帶 hash，可長期快取；index.html 不快取，部署新版立刻生效
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA：/chat/{thread_id} 等前端路由都回 index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
