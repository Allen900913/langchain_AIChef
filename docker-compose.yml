version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-ai-chef
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zxcv65428
      POSTGRES_DB: ai_memory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant-ai-chef
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
